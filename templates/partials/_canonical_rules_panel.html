<div id="canonical-rules-panel" data-pair-id="{{ pair.pair_id if pair else '' }}">
    {% if pair %}
    <!-- Create canonical rule -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Create Rule for Catalogue</h2>
        </div>

        <button id="create-canonical-rule" class="save-button">
            Create
        </button>

        {% include "partials/_canonical_rule_create_form.html" %}
    </div>
    {% endif %}

    <!-- Rules list -->
    <div class="card">
        {% if pair %}
            <form id="catalogue-filters" class="catalogue-filters"
                  hx-get="/admin-panel/canonical-rules/rules"
                  hx-trigger="change"
                  hx-include="#canonical-rules-pair-select"
                  hx-target="#canonical-rules-list"
                  hx-swap="outerHTML"
                  hx-indicator="#loader"
                  onsubmit="return false">
                <div class="form-group">
                    <label for="catalogue-filter-level">Level</label>
                    <select id="catalogue-filter-level" name="level" class="form-select">
                        <option value="">All levels</option>
                        {% for level in cefr_levels %}
                        <option value="{{ level }}"{% if filters and filters.level == level %} selected{% endif %}>{{ level }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="catalogue-filter-category">Category</label>
                    <select id="catalogue-filter-category" name="category" class="form-select">
                        <option value="">All categories</option>
                        {% for category_name in filter_categories %}
                        <option value="{{ category_name }}"{% if filters and filters.category == category_name %} selected{% endif %}>{{ category_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="catalogue-filter-status">Status</label>
                    <select id="catalogue-filter-status" name="status" class="form-select">
                        <option value="">All statuses</option>
                        <option value="active"{% if filters and filters.status == 'active' %} selected{% endif %}>Active</option>
                        <option value="inactive"{% if filters and filters.status == 'inactive' %} selected{% endif %}>Inactive</option>
                    </select>
                </div>
                <input type="hidden" id="catalogue-sort" name="sort" value="{{ sort }}">
                <input type="hidden" id="catalogue-dir" name="dir" value="{{ dir }}">
                <button type="button" id="catalogue-filters-reset" class="catalogue-filters-reset"
                        hx-on:click="this.form.reset(); document.getElementById('catalogue-filter-level').dispatchEvent(new Event('change', {bubbles: true}))">
                    Reset
                </button>
            </form>
            {% include "partials/_canonical_rules_list.html" %}
        {% else %}
            <div id="canonical-rules-list">
                <p class="page-subtext">Select a language pair to view its canonical rules.</p>
            </div>
        {% endif %}
    </div>
</div>
